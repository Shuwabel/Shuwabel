name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF4A1C&color_dots=#EAE3D6,#FFC9B8,#FF9B7D,#FF6A43,#FF4A1C
            dist/snake-dark.svg?palette=github-dark&color_snake=#C6F432&color_dots=#1E1B18,#5A1C0C,#9E2E10,#D93A14,#FF4A1C
      - name: Publish to the output branch
        run: |
          mkdir -p ../snake-out && cp dist/*.svg ../snake-out/ && cd ../snake-out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
